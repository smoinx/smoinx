name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: smoinx

          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2334E8FF&color_dots=%233B4055,%235B43F4,%238A52FF,%233F5BFF,%2334E8FF

            dist/github-contribution-grid-snake.svg?color_snake=%2300CFFF&color_dots=%23E4E8F3,%237C5CFF,%23906BFF,%233F5BFF,%2300D8FF

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
