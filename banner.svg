<svg width="1200" height="400" viewBox="0 0 1200 400"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.06">

    <!-- Vertical -->
    <g stroke="#22D3EE">

      <line x1="0" y1="0" x2="0" y2="400"/>

      <line x1="50" y1="0" x2="50" y2="400"/>

      <line x1="100" y1="0" x2="100" y2="400"/>

      <line x1="150" y1="0" x2="150" y2="400"/>

      <line x1="200" y1="0" x2="200" y2="400"/>

      <line x1="250" y1="0" x2="250" y2="400"/>

      <line x1="300" y1="0" x2="300" y2="400"/>

      <line x1="350" y1="0" x2="350" y2="400"/>

      <line x1="400" y1="0" x2="400" y2="400"/>

      <line x1="450" y1="0" x2="450" y2="400"/>

      <line x1="500" y1="0" x2="500" y2="400"/>

      <line x1="550" y1="0" x2="550" y2="400"/>

      <line x1="600" y1="0" x2="600" y2="400"/>

      <line x1="650" y1="0" x2="650" y2="400"/>

      <line x1="700" y1="0" x2="700" y2="400"/>

      <line x1="750" y1="0" x2="750" y2="400"/>

      <line x1="800" y1="0" x2="800" y2="400"/>

      <line x1="850" y1="0" x2="850" y2="400"/>

      <line x1="900" y1="0" x2="900" y2="400"/>

      <line x1="950" y1="0" x2="950" y2="400"/>

      <line x1="1000" y1="0" x2="1000" y2="400"/>

      <line x1="1050" y1="0" x2="1050" y2="400"/>

      <line x1="1100" y1="0" x2="1100" y2="400"/>

      <line x1="1150" y1="0" x2="1150" y2="400"/>

    </g>

  </g>

  <!-- Border -->
  <rect
      x="15"
      y="15"
      width="1170"
      height="370"
      rx="18"
      fill="none"
      stroke="url(#accent)"
      stroke-width="2"
      filter="url(#glow)"
  />

  <!-- Title -->

  <text
      x="600"
      y="80"
      fill="#22D3EE"
      font-size="42"
      text-anchor="middle"
      font-family="JetBrains Mono, monospace">

      BUILDING AI SOLUTIONS

  </text>

</svg>
